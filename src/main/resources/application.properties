# Configuración de Hibernate para que cree la base de datos automáticamente
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/portfolio

# Configuración de Hibernate
# opciones: none, update, drop-and-create, create
quarkus.hibernate-orm.database.generation=drop-and-create
# quarkus.hibernate-orm.sql-load-script=no-data.sql